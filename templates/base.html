<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GlobeTrotter{% endblock %} — Cameroon Travel Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241C;
    --ink-soft:#3F5147;
    --bg:#FAFAF9;
    --surface:#FFFFFF;
    --line:#E7E4DC;
    --forest:#0F6B4C;
    --forest-dark:#0B4F38;
    --gold:#D9A441;
    --gold-dark:#B9832B;
    --danger:#B3432D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  a{color:inherit;text-decoration:none;}
  .container{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* Nav */
  nav.topnav{
    position:sticky;top:0;z-index:40;
    background:rgba(250,250,249,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .navwrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;}
  .brand svg{flex:none;}
  .navlinks{display:flex;align-items:center;gap:6px;}
  .navlinks a{
    padding:8px 14px;border-radius:8px;font-size:0.92rem;font-weight:500;color:var(--ink-soft);
    transition:background .15s, color .15s;
  }
  .navlinks a:hover{background:#F0EEE6;color:var(--ink);}
  .navlinks a.active{color:var(--forest-dark);background:#E7F1EC;}
  .navlinks .cta{background:var(--forest);color:#fff;}
  .navlinks .cta:hover{background:var(--forest-dark);}
  #navUserSlot{display:flex;align-items:center;gap:10px;}
  .pill{font-size:0.8rem;color:var(--ink-soft);}
  .btn-ghost{border:1px solid var(--line);background:transparent;padding:7px 13px;border-radius:8px;font-size:0.88rem;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .btn-ghost:hover{border-color:var(--forest);color:var(--forest-dark);}

  /* Generic components */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--forest);color:#fff;border:none;border-radius:9px;
    padding:11px 20px;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:inherit;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:var(--forest-dark);}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:var(--gold);color:var(--ink);}
  .btn-gold:hover{background:var(--gold-dark);color:#fff;}
  .btn-outline{background:transparent;color:var(--forest-dark);border:1.5px solid var(--forest);}
  .btn-outline:hover{background:var(--forest);color:#fff;}
  .btn:disabled{opacity:0.55;cursor:not-allowed;}
  input,select,textarea{
    font-family:inherit;font-size:0.95rem;padding:10px 12px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--forest);outline-offset:1px;border-color:var(--forest);}
  label{font-size:0.85rem;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field{margin-bottom:16px;}
  .tag{
    display:inline-flex;align-items:center;font-size:0.75rem;font-weight:600;
    padding:3px 10px;border-radius:999px;background:#F0EEE6;color:var(--ink-soft);
  }
  .banner{padding:11px 14px;border-radius:9px;font-size:0.88rem;margin-bottom:16px;display:none;}
  .banner.error{background:#FBEAE5;color:var(--danger);border:1px solid #EFC7BA;}
  .banner.success{background:#E7F1EC;color:var(--forest-dark);border:1px solid #BFE0CE;}
  .banner.show{display:block;}
  .skeleton{background:linear-gradient(90deg,#EFEDE5 25%,#F6F4EE 37%,#EFEDE5 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0;color:var(--ink-soft);font-size:0.85rem;}

  @media (max-width:640px){
    .navlinks span.linktext{display:none;}
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="navwrap">
    <a href="/" class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" stroke="#0F6B4C" stroke-width="1.6"/>
        <path d="M13 4C13 4 8 9 8 13.5C8 17 10 19 13 19C16 19 18 17 18 13.5C18 9 13 4 13 4Z" fill="#D9A441"/>
        <circle cx="13" cy="12.7" r="2.1" fill="#FAFAF9"/>
      </svg>
      GlobeTrotter
    </a>
    <div class="navlinks" id="navLinks">
      <a href="/" data-path="/">Home</a>
      <a href="/app/destinations" data-path="/app/destinations">Destinations</a>
      <a href="/app/recommendations" data-path="/app/recommendations">Recommendations</a>
      <a href="/app/itineraries" data-path="/app/itineraries">My Trips</a>
    </div>
    <div id="navUserSlot"></div>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <span>GlobeTrotter Travel Assistant — CS 4122 Phase 1 Monolith</span>
    <span>Built for exploring Cameroon 🇨🇲</span>
  </div>
</footer>

<script src="/static/js/main.js"></script>
<script>
  document.querySelectorAll('#navLinks a').forEach(a=>{
    if(a.getAttribute('data-path') === window.location.pathname) a.classList.add('active');
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
