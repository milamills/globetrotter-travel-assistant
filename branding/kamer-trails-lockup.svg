<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#12805A"/>
      <stop offset="100%" stop-color="#0B4F38"/>
    </radialGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B4F38" flood-opacity="0.3"/>
    </filter>
    <style>
      .word { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .tag  { font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ============ ICON (left) ============ -->
  <g transform="translate(20, 20)">
    <circle cx="100" cy="100" r="94" fill="url(#bg2)"/>
    <circle cx="100" cy="100" r="76" fill="none" stroke="#D9A441" stroke-width="2.2" opacity="0.85"/>

    <rect x="97" y="20" width="5.5" height="12" rx="2" fill="#D9A441"/>
    <rect x="97" y="168" width="5.5" height="12" rx="2" fill="#D9A441" opacity="0.55"/>
    <rect x="20" y="97" width="12" height="5.5" rx="2" fill="#D9A441" opacity="0.55"/>
    <rect x="168" y="97" width="12" height="5.5" rx="2" fill="#D9A441" opacity="0.55"/>

    <g filter="url(#soft2)">
      <path d="M100 47
               C124 47 143 65 143 89
               C143 113 117 136 103 148
               C102 149 98 149 97 148
               C83 136 57 113 57 89
               C57 65 76 47 100 47 Z"
            fill="#D9A441"/>
      <circle cx="100" cy="88" r="16" fill="#FAFAF9"/>
    </g>

    <circle cx="126" cy="150" r="5.5" fill="#FAFAF9" opacity="0.95"/>
    <circle cx="141" cy="160" r="4.2" fill="#FAFAF9" opacity="0.75"/>
    <circle cx="153" cy="168" r="3" fill="#FAFAF9" opacity="0.5"/>
  </g>

  <!-- ============ WORDMARK (right) ============ -->
  <text x="245" y="122" class="word" font-size="58" font-weight="700" fill="#16241C">Kamer Trails</text>
  <text x="248" y="160" class="tag" font-size="19" fill="#3F5147">Explore Cameroon, town by town</text>

  <!-- underline accent -->
