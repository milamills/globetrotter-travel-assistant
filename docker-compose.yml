version: "3.8"

services:
  web:
    build: .
    image: milamills/globetrotter:local
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
      - GLOBETROTTER_SECRET=change-me
    volumes:
      - ./data:/app/data     # persist database between container runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
